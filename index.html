<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Org Chart - Interactive Organization Directory</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Beautiful App Loader Overlay -->
    <div id="app-loader" class="app-loader">
        <div class="loader-backdrop"></div>
        <div class="loader-card">
            <div class="loader-visual">
                <div class="loader-spinner-outer"></div>
                <div class="loader-spinner-inner"></div>
                <div class="loader-logo-container">
                    <svg class="loader-logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M32 18 L18 44" stroke="var(--accent-primary)" stroke-width="3" stroke-linecap="round" class="logo-path-left" />
                        <path d="M32 18 L46 44" stroke="var(--accent-primary)" stroke-width="3" stroke-linecap="round" class="logo-path-right" />
                        <circle cx="32" cy="18" r="7" fill="var(--accent-primary)" class="logo-node-top" />
                        <circle cx="18" cy="44" r="5" fill="var(--accent-primary)" class="logo-node-left" />
                        <circle cx="46" cy="44" r="5" fill="var(--accent-primary)" class="logo-node-right" />
                    </svg>
                </div>
            </div>
            <div class="loader-text-group">
                <h2 class="loader-app-name">HR Org Chart</h2>
                <div class="loader-status-container">
                    <span class="loader-status" id="loader-status">กำลังเริ่มต้นระบบ...</span>
                </div>
            </div>
            <div class="loader-progress-container">
                <div class="loader-progress-track">
                    <div class="loader-progress-bar" id="loader-progress-bar" style="width: 0%"></div>
                </div>
                <span class="loader-percent" id="loader-percent">0%</span>
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i data-lucide="network" class="logo-icon"></i>
                    <span>HR Org Chart</span>
                </div>
            </div>
            
            <div class="sidebar-section">
                <h3>Statistics</h3>
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-value" id="total-headcount">0</span>
                        <span class="stat-label">Total Headcount</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="total-departments">0</span>
                        <span class="stat-label">Departments</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>Departments</h3>
                <ul class="department-list" id="sidebar-dept-list">
                    <!-- Loaded dynamically -->
                </ul>
            </div>

            <div class="sidebar-footer">
                <button class="btn btn-secondary btn-block" id="btn-export-data" style="margin-bottom: 8px;">
                    <i data-lucide="download"></i> Export Backup (.json)
                </button>
                <button class="btn btn-secondary btn-block" id="btn-import-trigger">
                    <i data-lucide="upload"></i> Import Backup (.json)
                </button>
                <input type="file" id="import-file-input" accept=".json" style="display: none;">
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="search-container">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" id="search-input" placeholder="Search employees by name, role or department...">
                    <div class="search-results-dropdown" id="search-results"></div>
                </div>

                <div class="actions-group">
                    <button class="btn btn-secondary" id="btn-sync-microsoft" style="margin-right: 8px;">
                        <i data-lucide="refresh-cw"></i> Sync Microsoft 365
                    </button>
                    <button class="btn btn-primary" id="btn-add-employee">
                        <i data-lucide="user-plus"></i> Add Employee
                    </button>
                </div>
            </header>

            <!-- Chart Control Bar -->
            <div class="chart-controls">
                <div class="view-info">
                    <h2 id="current-view-title">Overall Organization</h2>
                    <span id="current-view-desc">Showing complete hierarchy</span>
                </div>
                <div class="zoom-controls">
                    <button class="zoom-btn" id="zoom-out" title="Zoom Out"><i data-lucide="minus"></i></button>
                    <span class="zoom-level" id="zoom-percent">100%</span>
                    <button class="zoom-btn" id="zoom-in" title="Zoom In"><i data-lucide="plus"></i></button>
                    <button class="zoom-btn" id="zoom-fit" title="Fit to Screen"><i data-lucide="maximize-2"></i></button>
                </div>
            </div>

            <!-- Chart Container (Viewport) -->
            <div class="chart-viewport" id="chart-viewport">
                <!-- Instruction tooltip -->
                <div class="canvas-tip">
                    <i data-lucide="info"></i> Drag to pan. Scroll to zoom. Click card to view details.
                </div>
                
                <!-- Zoomable/Pannable Canvas -->
                <div class="chart-canvas" id="chart-canvas">
                    <!-- SVG Overlay for connector lines -->
                    <svg class="connections-overlay" id="svg-overlay"></svg>
                    
                    <!-- DOM tree content -->
                    <div class="tree-container" id="tree-container">
                        <!-- Rendered dynamically -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Employee Detail Drawer (Slide over from right) -->
    <div class="drawer-overlay" id="detail-drawer-overlay"></div>
    <div class="drawer" id="detail-drawer">
        <div class="drawer-header">
            <h3>Employee Profile</h3>
            <button class="close-btn" id="close-detail-drawer"><i data-lucide="x"></i></button>
        </div>
        <div class="drawer-body" id="detail-drawer-body">
            <!-- Rendered dynamically -->
        </div>
        <div class="drawer-footer">
            <button class="btn btn-secondary" id="btn-edit-employee">
                <i data-lucide="edit"></i> Edit Details
            </button>
            <button class="btn btn-danger" id="btn-delete-employee">
                <i data-lucide="trash-2"></i> Delete Employee
            </button>
        </div>
    </div>

    <!-- Employee Form Modal -->
    <div class="modal-overlay" id="form-modal-overlay"></div>
    <div class="modal" id="form-modal">
        <div class="modal-header">
            <h3 id="modal-title">Add New Employee</h3>
            <button class="close-btn" id="close-form-modal"><i data-lucide="x"></i></button>
        </div>
        <form id="employee-form">
            <input type="hidden" id="form-employee-id">
            <input type="hidden" id="form-person-id">
            <input type="hidden" id="form-photo-data">
            <div class="modal-body">
                <div class="form-row">
                    <div class="profile-form-top">
                        <button type="button" class="photo-picker" id="btn-photo-trigger">
                            <span class="form-photo-preview" id="form-photo-preview">
                                <i data-lucide="camera"></i>
                            </span>
                            <span class="photo-picker-copy">
                                <strong>Employee Photo</strong>
                                <small>Upload a clear headshot</small>
                            </span>
                        </button>
                        <button type="button" class="btn btn-secondary btn-sm" id="btn-remove-photo">Remove</button>
                        <input type="file" id="form-photo-input" accept="image/*" style="display: none;">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="form-person-link">Employee Profile / Multiple Positions</label>
                        <input type="text" id="form-person-link" list="person-list" placeholder="Choose existing employee to link this position">
                        <datalist id="person-list"></datalist>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="form-name">Full Name <span class="required">*</span></label>
                        <input type="text" id="form-name" required placeholder="e.g. John Doe">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="form-role">Job Title <span class="required">*</span></label>
                        <input type="text" id="form-role" required placeholder="e.g. Senior Software Engineer">
                    </div>
                </div>
                <div class="form-row two-cols">
                    <div class="form-group">
                        <label for="form-department">Department <span class="required">*</span></label>
                        <input type="text" id="form-department" list="department-list" required placeholder="e.g. Engineering">
                        <datalist id="department-list"></datalist>
                    </div>
                    <div class="form-group">
                        <label for="form-manager">Reports To</label>
                        <input type="text" id="form-manager" list="manager-list" placeholder="None (Top Level)">
                        <datalist id="manager-list"></datalist>
                    </div>
                </div>
                <div class="form-row two-cols">
                    <div class="form-group">
                        <label for="form-email">Email Address</label>
                        <input type="email" id="form-email" placeholder="e.g. john.doe@company.com">
                    </div>
                    <div class="form-group">
                        <label for="form-phone">Phone Number</label>
                        <input type="tel" id="form-phone" placeholder="e.g. 081-234-5678">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="form-bio">Bio / Notes</label>
                        <textarea id="form-bio" rows="3" placeholder="Brief description of responsibilities or bio..."></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="btn-cancel-form">Cancel</button>
                <button type="submit" class="btn btn-primary" id="btn-submit-form">Save Employee</button>
            </div>
        </form>
    </div>

    <!-- Notification system -->
    <div class="notification-container" id="notification-container"></div>

    <script src="app.js?v=3.4"></script>
</body>
</html>
